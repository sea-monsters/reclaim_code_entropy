name: Finite fixture evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standard-library-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B evals/check_contracts.py
      - name: Install evidence search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Nonempty regression and evidence suites
        run: python -B evals/run_tests.py
